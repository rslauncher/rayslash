app-id: dev.rayan6ms.rayslash
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: rayslash
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  # Allow official builds to embed the optional public diagnostics endpoint supplied by CI.
  # An unset/empty value leaves remote diagnostics unavailable without affecting the app.
  secret-env:
    - RAYSLASH_SENTRY_DSN
# The host is required launcher infrastructure, not a module. No official or community
# module package is bundled; users still choose every module from Settings -> Modules.
finish-args:
  # Required for the signed module catalog, selected module downloads, and modules
  # whose reviewed permissions include an HTTPS service origin.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # A desktop launcher must be able to discover configured folders and host desktop
  # entries. External commands are executed through flatpak-spawn on the host.
  - --filesystem=host:ro
  - --filesystem=xdg-data/applications:ro
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: rayslash-module-host
    buildsystem: simple
    build-commands:
      - install -Dm0755 rayslash-module-host /app/libexec/rayslash/rayslash-module-host
      - install -Dm0755 rayslash-module-compiler /app/libexec/rayslash/rayslash-module-compiler
    sources:
      - type: archive
        url: https://github.com/rslauncher/rayslash-module-host/releases/download/v0.1.4/rayslash-module-host-v0.1.4-x86_64-unknown-linux-gnu.tar.xz
        sha256: ad42b2bc7ab526d83b98784a5508d78dc024c04588b9924ed9f1b68eec245311
        only-arches:
          - x86_64
      - type: archive
        url: https://github.com/rslauncher/rayslash-module-host/releases/download/v0.1.4/rayslash-module-host-v0.1.4-aarch64-unknown-linux-gnu.tar.xz
        sha256: bc39524d3d066f59ec9fbc23b0c324bf79b325606a1e9bcdc5eb6e9900953329
        only-arches:
          - aarch64
  - name: rayslash
    buildsystem: simple
    build-commands:
      - cargo build --release --locked --offline -p rayslash
      - install -Dm0755 target/release/rayslash /app/bin/rayslash
      - install -Dm0644 packaging/linux/dev.rayan6ms.rayslash.desktop /app/share/applications/dev.rayan6ms.rayslash.desktop
      - install -Dm0644 icons/rayslash-icon.svg /app/share/icons/hicolor/scalable/apps/dev.rayan6ms.rayslash.svg
      - install -Dm0644 packaging/linux/dev.rayan6ms.rayslash.metainfo.xml /app/share/metainfo/dev.rayan6ms.rayslash.metainfo.xml
    sources:
      - type: dir
        path: ../..
