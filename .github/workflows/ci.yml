name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils libfontconfig1-dev
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace
      - name: Validate packaging metadata
        run: packaging/validate-metadata.sh

  fedora-rpm-offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-latest
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    steps:
      - name: Install packaging tools
        run: dnf install -y appstream cargo createrepo_c curl desktop-file-utils fontconfig-devel gcc git rpm-build rpmlint rust xz
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Trust the container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Prepare source and vendor archives
        run: packaging/fedora/prepare-sources.sh "$RUNNER_TEMP/sources" "$GITHUB_SHA"
      - name: Build source RPM
        run: |
          mkdir -p "$RUNNER_TEMP/rpmbuild"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp "$RUNNER_TEMP/sources"/* "$RUNNER_TEMP/rpmbuild/SOURCES/"
          cp packaging/fedora/rayslash.spec "$RUNNER_TEMP/rpmbuild/SPECS/"
          rpmbuild -bs \
            --define "_topdir $RUNNER_TEMP/rpmbuild" \
            "$RUNNER_TEMP/rpmbuild/SPECS/rayslash.spec"
      - name: Rebuild without Cargo network access
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          mkdir -p "$RUNNER_TEMP/rebuild"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          # The Linux job owns the complete Rust test suite. This matrix verifies
          # offline compilation and the installed RPM surface without rebuilding
          # every release-mode test harness a second time.
          rpmbuild --rebuild --nocheck \
            --define "_topdir $RUNNER_TEMP/rebuild" \
            "$RUNNER_TEMP/rpmbuild/SRPMS/"*.src.rpm
      - name: Assemble the self-contained RPM for validation
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fedora-package-set"
          version=$(awk '$1 == "Version:" { print $2; exit }' packaging/fedora/rayslash.spec)
          app_rpm=$(find "$RUNNER_TEMP/rebuild/RPMS" -type f \
            -name "rayslash-${version}-*.fc44.${{ matrix.architecture }}.rpm" -print -quit)
          test -n "$app_rpm"
          cp -v "$app_rpm" \
            "$GITHUB_WORKSPACE/fedora-package-set/rayslash-${version}-${{ matrix.architecture }}.rpm"
      - name: Validate the self-contained Fedora package
        run: |
          cd fedora-package-set
          rpm -Kv *.rpm
          rpmlint *.rpm
          app_rpm=$(find . -maxdepth 1 -type f -name 'rayslash-*.rpm' -print -quit)
          test -n "$app_rpm"
          rpm -qpl "$app_rpm" | grep -Fx /usr/libexec/rayslash/rayslash-module-host
          rpm -qpl "$app_rpm" | grep -Fx /usr/libexec/rayslash/rayslash-module-compiler
          rpm -qp --provides "$app_rpm" | grep -F 'rayslash-module-host ='
          if rpm -qpl "$app_rpm" | grep -E 'module\.(wasm|toml)$'; then
            echo "the app RPM unexpectedly bundles optional module files" >&2
            exit 1
          fi
          mkdir dnf-repo
          cp "$app_rpm" dnf-repo/
          createrepo_c dnf-repo >/dev/null
          set +e
          dnf --disablerepo='*' \
            --repofrompath=rayslash-local,"file://$PWD/dnf-repo" \
            --setopt=rayslash-local.gpgcheck=0 --refresh \
            install rayslash --assumeno | tee dnf-transaction.txt
          dnf_status=${PIPESTATUS[0]}
          set -e
          test "$dnf_status" -eq 1
          grep -F 'Installing:' dnf-transaction.txt
          grep -E '^[[:space:]]+rayslash[[:space:]]' dnf-transaction.txt
          if grep -F rayslash-module-host dnf-transaction.txt; then
            echo "DNF unexpectedly selected a separate module-host package" >&2
            exit 1
          fi
          test "$(find . -maxdepth 1 -type f -name '*.rpm' | wc -l)" -eq 1
